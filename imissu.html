<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>idk</title>
	<style>
		:root {
			--ink: #304446;
			--petal-yellow: #f7c84b;
			--petal-yellow-light: #ffe59a;
			--leaf: #6aa56b;
			--leaf-dark: #39705a;
			--pink: #f28e9e;
			--paper: #fff9f0;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			overflow: hidden;
			color: var(--ink);
			background:
				radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .7), transparent 34%),
				linear-gradient(135deg, #fff5d9 0%, #ffe9e8 54%, #f6dce7 100%);
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
		}

		.entry {
			position: fixed;
			inset: 0;
			display: grid;
			place-items: center;
			z-index: 20;
			background: #300a16;
			transition: opacity .25s ease, visibility .25s ease;
		}

		.entry.is-leaving { opacity: 0; visibility: hidden; }
		.pixel-loader {
			display: grid;
			grid-template-columns: repeat(9, clamp(13px, 3.3vw, 25px));
			grid-auto-rows: clamp(13px, 3.3vw, 25px);
			gap: clamp(3px, .7vw, 6px);
			transform: rotate(-3deg);
		}
		.pixel {
			width: 100%;
			height: 100%;
			border-radius: 2px;
			background: hsl(350 100% var(--pixel-light));
			box-shadow: 0 0 9px hsl(350 100% var(--pixel-light) / .6);
			opacity: .16;
			animation: pixel-flicker var(--pixel-speed) ease-in-out var(--pixel-delay) infinite alternate;
		}

		.intro-art { display: none; }
		.intro-glow {
			position: absolute;
			inset: 22%;
			border-radius: 50%;
			background: rgba(255, 246, 182, .6);
			box-shadow: 0 0 55px 26px rgba(255, 235, 175, .52);
			animation: glow-open 1.25s .35s cubic-bezier(.2, .8, .3, 1) both;
		}

		.intro-star {
			position: absolute;
			left: 50%;
			top: 50%;
			width: 13px;
			height: 13px;
			background: #fff4ad;
			clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
			transform: translate(-50%, -50%);
			animation: star-wake 1.2s ease-out both;
		}

		.intro-bud {
			position: absolute;
			left: 50%;
			top: 51%;
			width: 92px;
			height: 158px;
			transform: translate(-50%, -50%);
			animation: bud-arrive .8s .82s cubic-bezier(.2, 1.3, .35, 1) both;
		}

		.intro-bud::before {
			position: absolute;
			left: 39px;
			bottom: 0;
			width: 14px;
			height: 72px;
			border-radius: 50%;
			background: #4d8965;
			content: "";
		}

		.intro-bud::after {
			position: absolute;
			left: 13px;
			bottom: 42px;
			width: 66px;
			height: 93px;
			border-radius: 55% 55% 42% 42%;
			background: linear-gradient(135deg, #a8c98a, #809d87 48%, #d4a47f);
			box-shadow: inset 10px 0 0 rgba(255, 240, 199, .28), 0 8px 18px rgba(135, 87, 94, .14);
			content: "";
		}

		.intro-ribbon {
			position: absolute;
			left: 50%;
			top: 52%;
			width: 220px;
			height: 64px;
			border: 3px solid rgba(230, 157, 160, .72);
			border-left-color: transparent;
			border-right-color: transparent;
			border-radius: 50%;
			transform: translate(-50%, -50%) rotate(-14deg);
			animation: ribbon-unfurl 1.15s 1.05s ease-in-out both;
		}

		.intro-ribbon::after {
			position: absolute;
			left: 50%;
			top: 16px;
			width: 18px;
			height: 31px;
			border: 3px solid rgba(230, 157, 160, .72);
			border-radius: 3px 14px 3px 14px;
			content: "";
			transform: translateX(-50%) rotate(45deg);
		}

		.scene {
			position: relative;
			display: grid;
			place-items: center;
			min-height: 100vh;
			padding: 3vh 1rem;
			isolation: isolate;
			opacity: 0;
		}

		.scene.revealed { animation: scene-reveal .8s .05s cubic-bezier(.2, .8, .25, 1) both; }

		.scene::before,
		.scene::after {
			position: absolute;
			content: "";
			z-index: -1;
			width: 28rem;
			height: 28rem;
			border: 1px solid rgba(255, 255, 255, .38);
			border-radius: 50%;
			opacity: .7;
		}

		.scene::before { transform: translate(-42vw, -34vh); }
		.scene::after { transform: translate(43vw, 36vh) scale(.7); }

		.bouquet-card {
			position: relative;
			width: min(100%, 670px);
			text-align: center;
			animation: arrive .95s cubic-bezier(.18, .8, .25, 1.2) both;
		}

		.bouquet-wrap {
			position: relative;
			height: min(71vh, 560px);
			min-height: 400px;
			display: grid;
			place-items: end center;
		}

		.bouquet {
			width: min(92vw, 600px);
			max-height: 100%;
			overflow: visible;
			filter: drop-shadow(0 18px 14px rgba(150, 94, 105, .16));
		}

		.stem { fill: none; stroke: var(--leaf-dark); stroke-linecap: round; stroke-width: 7; stroke-dasharray: 600; stroke-dashoffset: 600; }
		.stem.thin { stroke-width: 5; }
		.scene.revealed .stem { animation: draw-stem 1s cubic-bezier(.2, .8, .3, 1) both; }
		.scene.revealed .stem.thin { animation-delay: .18s; }
		.leaf { fill: var(--leaf); stroke: var(--leaf-dark); stroke-width: 2.5; }
		.leaf { fill: url(#leafDeep); }
		.leaf.light { fill: url(#leafLight); }
		.leaf.vein { fill: none; stroke: rgba(42, 103, 76, .65); stroke-width: 2.2; stroke-linecap: round; }
		.leaf.vein.fine { display: none; }

		.flower > .petal { animation: petal-bloom .8s cubic-bezier(.16, 1.35, .45, 1) both; }
		.flower > .flower-center { animation: center-bloom .8s cubic-bezier(.16, 1.35, .45, 1) both; }
		.flower > .petal, .flower > .flower-center { animation-play-state: paused; }
		.scene.revealed .flower > .petal, .scene.revealed .flower > .flower-center { animation-play-state: running; }

		.flower:nth-of-type(2) > * { animation-delay: .18s; }
		.flower:nth-of-type(3) > * { animation-delay: .36s; }
		.flower:nth-of-type(4) > * { animation-delay: .54s; }
		.flower:nth-of-type(5) > * { animation-delay: .72s; }
		.flower:nth-of-type(6) > * { animation-delay: .9s; }

		.petal { stroke: none; opacity: .88; filter: url(#petalSoft); }
		.petal-line { fill: none; stroke: rgba(164, 91, 74, .28); stroke-width: 2; stroke-linecap: round; }
		.pollen { fill: #f4b957; stroke: #bd7945; stroke-width: 1; }
		.yellow .petal { fill: url(#yellowPetal); }
		.yellow .petal.alt { fill: url(#yellowPetalLight); }
		.green .petal { fill: url(#greenPetal); }
		.green .petal.alt { fill: url(#greenPetalLight); }
		.flower { filter: url(#flowerDepth); }
		.flower-halo { opacity: 0; filter: url(#softGlow); }
		.scene.revealed .flower-halo { animation: halo-bloom .9s ease-out both; }
		.flower.yellow .flower-halo { fill: url(#yellowHalo); }
		.flower.green .flower-halo { fill: url(#greenHalo); }
		.flower-center { fill: url(#flowerCenter); stroke: #a95b3c; stroke-width: 2.5; }
		.pot-body { fill: url(#potBody); stroke: #a9574f; stroke-width: 3; }
		.pot-rim { fill: url(#potRim); stroke: #a9574f; stroke-width: 3; }
		.pot-shine { fill: none; stroke: rgba(255, 230, 195, .75); stroke-linecap: round; }

		.message {
			position: relative;
			margin: .45rem 0 0;
			min-height: 2.4rem;
			color: #8d5964;
			font-family: Georgia, serif;
			font-size: clamp(1.25rem, 3vw, 1.7rem);
			letter-spacing: .04em;
		}

		.message::after {
			display: inline-block;
			width: 2px;
			height: 1.2em;
			margin-left: 4px;
			vertical-align: -.2em;
			background: #d88491;
			content: "";
			animation: blink .8s steps(2) infinite;
		}

		.heart, .sparkle {
			position: fixed;
			pointer-events: none;
			z-index: 5;
		}

		.heart {
			color: var(--heart-color, #ed7d91);
			font-size: var(--heart-size, 1.3rem);
			line-height: 1;
			animation: float-heart var(--heart-time, 3.8s) ease-in forwards;
			filter: drop-shadow(0 2px 2px rgba(177, 87, 108, .14));
		}

		.sparkle {
			width: 10px;
			height: 10px;
			background: #fff3a9;
			clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
			animation: glimmer 1s ease-out forwards;
		}

		@keyframes pixel-flicker { 0% { opacity: .12; transform: scale(.82); } 45% { opacity: .62; transform: scale(1); } 100% { opacity: 1; transform: scale(.9); } }
		@keyframes draw-stem { to { stroke-dashoffset: 0; } }
		@keyframes star-wake { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.15); } 28% { opacity: 1; } 100% { opacity: .18; transform: translate(-50%, -50%) scale(1.7); } }
		@keyframes glow-open { from { opacity: 0; transform: scale(.18); } 70% { opacity: 1; } to { opacity: .64; transform: scale(1.3); } }
		@keyframes bud-arrive { from { opacity: 0; transform: translate(-50%, -43%) scale(.45); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
		@keyframes ribbon-unfurl { from { opacity: 0; transform: translate(-50%, -50%) rotate(-14deg) scale(.25); } 45% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -50%) rotate(12deg) scale(1.25); } }
		@keyframes scene-reveal { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
		@keyframes arrive { from { transform: translateY(18px); } to { transform: translateY(0); } }
		@keyframes petal-bloom { from { opacity: 0; rx: 4px; ry: 12px; } 70% { opacity: 1; rx: 28px; ry: 65px; } to { opacity: 1; rx: 25px; ry: 60px; } }
		@keyframes center-bloom { from { opacity: 0; r: 3px; } 70% { opacity: 1; r: 19px; } to { opacity: 1; r: 16px; } }
		@keyframes halo-bloom { from { opacity: 0; r: 15px; } 45% { opacity: .9; } to { opacity: .56; r: 76px; } }
		@keyframes float-heart { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.6) rotate(-10deg); } 12% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--heart-drift)), -190px) scale(1.08) rotate(18deg); } }
		@keyframes glimmer { 0% { opacity: 0; transform: scale(.2) rotate(0); } 35% { opacity: 1; } 100% { opacity: 0; transform: scale(1.7) rotate(90deg); } }
		@keyframes blink { 50% { opacity: 0; } }

		@media (max-width: 520px) {
			.bouquet-wrap { height: 66vh; min-height: 350px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
		}
	</style>
</head>

	<script>
		const message = "i was bored so i made this website for u:) ";
		const hearts = ["&hearts;", "&#9829;", "&hearts;"];
		const colors = ["#ef8b9a", "#d96c82", "#f4a6ac", "#e77691"];
		const messageNode = document.querySelector(".message");
		let character = 0;

		function typeMessage() {
			if (character <= message.length) {
				messageNode.textContent = message.slice(0, character);
				character += 1;
				window.setTimeout(typeMessage, 95);
			}
		}

		function addHeart(x, y, burst = false) {
			const heart = document.createElement("span");
			heart.className = "heart";
			heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
			heart.style.left = `${x}px`;
			heart.style.top = `${y}px`;
			heart.style.setProperty("--heart-color", colors[Math.floor(Math.random() * colors.length)]);
			heart.style.setProperty("--heart-size", `${.8 + Math.random() * 1.2}rem`);
			heart.style.setProperty("--heart-time", `${burst ? 2.1 + Math.random() * 1.2 : 3.4 + Math.random() * 2.4}s`);
			heart.style.setProperty("--heart-drift", `${-55 + Math.random() * 110}px`);
			document.body.appendChild(heart);
			heart.addEventListener("animationend", () => heart.remove());
		}

		function addSparkle() {
			const rect = document.querySelector(".bouquet").getBoundingClientRect();
			const sparkle = document.createElement("i");
			sparkle.className = "sparkle";
			sparkle.style.left = `${rect.left + 20 + Math.random() * (rect.width - 40)}px`;
			sparkle.style.top = `${rect.top + 35 + Math.random() * (rect.height * .6)}px`;
			document.body.appendChild(sparkle);
			sparkle.addEventListener("animationend", () => sparkle.remove());
		}

		function ambientHearts() {
			const bouquet = document.querySelector(".bouquet").getBoundingClientRect();
			addHeart(bouquet.left + bouquet.width * (.14 + Math.random() * .72), bouquet.bottom - bouquet.height * .16);
		}

		document.addEventListener("pointerdown", (event) => {
			for (let i = 0; i < 5; i += 1) {
				window.setTimeout(() => addHeart(event.clientX + (Math.random() - .5) * 35, event.clientY + (Math.random() - .5) * 25, true), i * 70);
			}
		});

		const entry = document.querySelector("#entry");
		const scene = document.querySelector(".scene");
		const pixelLoader = document.querySelector("#pixelLoader");
		const heartMask = [
			".###.###.",
			"#######.#",
			"#########",
			"#########",
			".#######.",
			"..#####..",
			"...###...",
			"....#....",
			"........."
		];
		heartMask.forEach((row) => row.split("").forEach((cell) => {
			if (cell !== "#") {
				const spacer = document.createElement("span");
				pixelLoader.appendChild(spacer);
				return;
			}
			const pixel = document.createElement("span");
			pixel.className = "pixel";
			pixel.style.setProperty("--pixel-delay", `${Math.random() * 1.8}s`);
			pixel.style.setProperty("--pixel-speed", `${.65 + Math.random() * .7}s`);
			pixel.style.setProperty("--pixel-light", `${65 + Math.random() * 30}%`);
			pixelLoader.appendChild(pixel);
		}));

		typeMessage();
		window.setTimeout(() => {
			entry.classList.add("is-leaving");
			scene.classList.add("revealed");
		}, 3500);

		window.setInterval(ambientHearts, 430);
		window.setInterval(addSparkle, 1250);
		for (let i = 0; i < 10; i += 1) window.setTimeout(ambientHearts, i * 190 + 400);
	</script>
</body>
</html>
